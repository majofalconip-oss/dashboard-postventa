function getObjetivos() { return OBJETIVOS_POR_MES[mesActual] || []; }
function getSprints() { return SPRINTS_POR_MES[mesActual] || []; }

function initValores(objetivos, sprints) {
    objetivos.forEach(obj => {
        obj.metricas.forEach(m => {
            sprints.forEach(s => {
                const key = `val${s.num}`;
                if (m[key] === undefined) m[key] = 0;
            });
            if (m.cierreJul === undefined) m.cierreJul = 0;
        });
    });
}

function calcularSemaforoObj(obj, sprints) {
    if (obj.noAplica) return "blue";
    let sprintActivo = null;
    for (let i = sprints.length - 1; i >= 0; i--) {
        const key = `val${sprints[i].num}`;
        for (const m of obj.metricas) {
            if (m.informativo) continue;
            if ((m[key] || 0) > 0) { sprintActivo = sprints[i].num; break; }
        }
        if (sprintActivo) break;
    }
    if (!sprintActivo) return "gray";
    let sumaRatio = 0, count = 0, todosVerdes = true;
    for (const m of obj.metricas) {
        if (m.informativo) continue;
        const val = m[`val${sprintActivo}`] || 0;
        const meta = m.metas[sprintActivo] || 0;
        if (meta > 0) { sumaRatio += val / meta; count++; if (val < meta) todosVerdes = false; }
    }
    if (todosVerdes && count > 0) return "green";
    const ratio = count > 0 ? sumaRatio / count : 0;
    if (ratio < 0.9) return "red";
    return "yellow";
}

function calcularValorReal(obj, sprints) {
    if (obj.noAplica) return null;
    let sprintActivo = null;
    for (let i = sprints.length - 1; i >= 0; i--) {
        const key = `val${sprints[i].num}`;
        for (const m of obj.metricas) {
            if (m.informativo) continue;
            if ((m[key] || 0) > 0) { sprintActivo = sprints[i].num; break; }
        }
        if (sprintActivo) break;
    }
    if (!sprintActivo) return 0;
    let suma = 0, count = 0;
    for (const m of obj.metricas) {
        if (m.informativo) continue;
        suma += (m[`val${sprintActivo}`] || 0);
        count++;
    }
    return count > 0 ? Math.round(suma / count) : 0;
}

    renderDashboardResumen();

function getProgressClass(semaforo) {
    switch(semaforo) {
        case "green": return "progress-green";
        case "yellow": return "progress-yellow";
        case "red": return "progress-red";
        default: return "";
    }
}

function renderHeader() {
    const sprints = getSprints();

    let html = `<tr><th style="width:3%">#</th><th style="width:14%">Objetivo General</th><th style="width:16%">Objetivo Específico</th>`;
    if (hasCierreJul) html += `<th style="width:6%">Julio</th>`;
    html += `<th style="width:9%">Meta ${MESES_LABEL[mesActual].split(' ')[0]}</th>`;
    sprints.forEach(s => { html += `<th style="width:${Math.floor(40/sprints.length)}%">Sprint ${s.num}<br>(${s.fecha})</th>`; });
    html += `<th style="width:7%">Valor Real</th><th style="width:5%">Semáforo</th></tr>`;

}

function renderSprintInputs(objIndex, sprintNum, obj) {
    const bloqueados = obj.bloquearSprints || [];
    const vacios = obj.vaciarSprints || [];
    const estaBloqueado = bloqueados.includes(sprintNum);
    const estaVacio = vacios.includes(sprintNum);
    let html = '';
    obj.metricas.forEach((m, mIdx) => {
        const val = m[`val${sprintNum}`] || 0;
        const meta = m.metas[sprintNum] || 0;
        const esInfo = m.informativo;
        const sufijo = esInfo ? '' : '%';
        // No mostrar meta si es 0 o no aplica
        let metaTexto = '';
        if (esInfo) metaTexto = 'Info';
        else if (meta > 0) metaTexto = `${meta}%`;
        else metaTexto = '';

        if (estaVacio) {
            // Completamente vacío - nada
            html += '';
        } else if (estaBloqueado) {
            // Sprint bloqueado: input gris deshabilitado con label visible
            if (obj.metricas.length > 1 && metaTexto) html += `<span class="metrica-label">${m.nombre} | ${metaTexto}</span>`;
            else if (obj.metricas.length > 1 && !metaTexto) html += `<span class="metrica-label">${m.nombre}</span>`;
            else if (metaTexto) html += `<span class="metrica-label">${metaTexto}</span>`;
            html += `<div class="metrica-row"><input type="number" class="sprint-input" value="" disabled style="background:#eee;color:#bbb;border-color:#e5e7eb;pointer-events:none;"><span style="display:inline-block;width:10px;text-align:left;">${sufijo}</span></div>`;
        } else if (meta === 0 && !esInfo) {
            // Meta 0: completamente vacío
            html += '';
        } else {
            if (obj.metricas.length > 1 && metaTexto) html += `<span class="metrica-label">${m.nombre} | ${metaTexto}</span>`;
            else if (obj.metricas.length > 1 && !metaTexto) html += `<span class="metrica-label">${m.nombre}</span>`;
            else if (metaTexto) html += `<span class="metrica-label">${metaTexto}</span>`;
            const displayVal = val > 0 ? val : '';
            html += `<div class="metrica-row"><input type="number" class="sprint-input" min="0" max="${esInfo?'9999':'100'}" value="${displayVal}" onchange="onMetricaChange(${objIndex},${mIdx},${sprintNum},this.value)" oninput="onMetricaChange(${objIndex},${mIdx},${sprintNum},this.value)"><span style="display:inline-block;width:10px;text-align:left;">${sufijo}</span></div>`;
        }
    });
    return html;
}

    tbody.innerHTML = "";
    let lastOg = "", ogIndex = 0;

    objetivos.forEach((obj, index) => {
        const row = document.createElement("tr");

        if (ogIndex % 2 === 1) row.style.backgroundColor = "#f2f2f5";
        const metaFormatted = obj.noAplica ? '<span class="na-badge">N/A</span>' : (obj.metaMes || obj.metaJulio || "").replace(/\n/g, "<br>");
        const valorReal = calcularValorReal(obj, sprints);
        const semaforo = calcularSemaforoObj(obj, sprints);
        const metricasDesc = obj.ocultarMetricas ? '' : obj.metricas.map(m => `• ${m.nombre}${m.informativo?' (info)':''}`).join("<br>");
        if (obj.noAplica) row.classList.add("na-row");

        let ogCell = '';

        if (isFirst) { const count = objetivos.filter(o => o.og === obj.og).length; ogCell = `<td class="og-col" rowspan="${count}">${obj.og}</td>`; }

        let badge = '';
        if (obj.esNuevo) badge = '<span class="nuevo-badge">NUEVO</span>';

        let cierreJulCell = '';
        if (hasCierreJul) {
            if (obj.arrastrado) {

                cierreJulCell = `<td class="cierre-jul-col"><div style="display:flex;align-items:center;justify-content:center;gap:2px;"><input type="number" class="cierre-jul-input" min="0" max="100" value="${cjVal}" onchange="onCierreJulChange(${index},this.value)"><span style="font-size:11px;color:#4a0e8f;font-weight:600;">%</span></div></td>`;
            } else {
                cierreJulCell = `<td class="cierre-jul-col"></td>`;
            }
        }

        let sprintCells = '';
        sprints.forEach(s => { sprintCells += `<td class="sprint-col">${renderSprintInputs(index, s.num, obj)}</td>`; });

        row.innerHTML = `<td style="text-align:center;font-weight:700;color:#4a0e8f;">${index+1}</td>${ogCell}<td class="objetivo-col"><div class="titulo">${obj.titulo}${badge}</div><div class="metas">${metricasDesc}</div></td>${cierreJulCell}<td class="meta-col">${metaFormatted}</td>${sprintCells}<td class="valor-real"><span id="valor-real-${index}" style="font-size:16px;">${valorReal===null?'—':valorReal+'%'}</span><div class="progress-bar"><div id="progress-${index}" class="progress-fill ${getProgressClass(semaforo)}" style="width:${valorReal===null?0:Math.min(valorReal,100)}%"></div></div></td><td class="semaforo-col"><span id="semaforo-${index}" class="semaforo ${semaforo}"></span></td>`;
        tbody.appendChild(row);
    });
    actualizarAvanceGeneral();
}

function onMetricaChange(objIndex, metricaIndex, sprintNum, value) {
    const obj = getObjetivos()[objIndex];
    obj.metricas[metricaIndex][`val${sprintNum}`] = parseFloat(value) || 0;
    const sprints = getSprints();
    const valorReal = calcularValorReal(obj, sprints);
    const semaforo = calcularSemaforoObj(obj, sprints);
    const el = document.getElementById(`valor-real-${objIndex}`);
    if (el) el.textContent = valorReal === null ? '—' : valorReal + '%';
    const se = document.getElementById(`semaforo-${objIndex}`);
    if (se) se.className = `semaforo ${semaforo}`;
    const pe = document.getElementById(`progress-${objIndex}`);
    if (pe) { pe.className = `progress-fill ${getProgressClass(semaforo)}`; pe.style.width = `${valorReal===null?0:Math.min(valorReal,100)}%`; }
    actualizarAvanceGeneral();
    guardarDatosDebounce();
}

function onCierreJulChange(objIndex, value) {
    const obj = getObjetivos()[objIndex];
    obj.metricas.forEach(m => { m.cierreJul = parseFloat(value) || 0; });

}

function calcularAvancePorOG(mes) {
    const objetivos = OBJETIVOS_POR_MES[mes] || [];
    const sprints = SPRINTS_POR_MES[mes] || [];
    const ogMap = {};
    objetivos.forEach(obj => {
        if (obj.noAplica || obj.arrastrado) return;
        const ogShort = obj.og.substring(0, obj.og.indexOf(':') + 1).trim();
        if (!ogMap[ogShort]) ogMap[ogShort] = [];
        const val = calcularValorReal(obj, sprints);
        if (val !== null) ogMap[ogShort].push(val);
    });
    const result = [];
    Object.keys(ogMap).forEach(og => {
        const vals = ogMap[og];
        const avg = vals.length > 0 ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
        result.push({ og, avg });
    });
    return result;
}

function calcularAvanceMes(mes) {
    const objetivos = OBJETIVOS_POR_MES[mes] || [];
    const sprints = SPRINTS_POR_MES[mes] || [];
    let suma = 0, count = 0;
    objetivos.forEach(obj => {
        if (obj.noAplica || obj.arrastrado) return;
        // Encontrar sprint más reciente con dato
        let sprintActivo = null;
        for (let i = sprints.length - 1; i >= 0; i--) {
            const key = `val${sprints[i].num}`;
            for (const m of obj.metricas) {
                if (m.informativo) continue;
                if ((m[key] || 0) > 0) { sprintActivo = sprints[i].num; break; }
            }
            if (sprintActivo) break;
        }
        if (!sprintActivo) return;
        // Cada métrica individual cuenta como un ítem
        obj.metricas.forEach(m => {
            if (m.informativo) return;
            const val = m[`val${sprintActivo}`] || 0;
            suma += val;
            count++;
        });
    });
    return count > 0 ? Math.round(suma / count * 10) / 10 : 0;
}

            (SPRINTS_POR_MES[mes] || []).forEach(s => { d[`val${s.num}`] = m[`val${s.num}`] || 0; });

function aplicarDatosCargados(data) {
    Object.keys(data).forEach(mes => {
        const objs = OBJETIVOS_POR_MES[mes];
        if (!objs) return;
        const metricas = data[mes];
        metricas.forEach((mArr, i) => {
            if (i >= objs.length) return;
            mArr.forEach((mData, j) => {
                if (j >= objs[i].metricas.length) return;
                Object.keys(mData).forEach(k => { objs[i].metricas[j][k] = mData[k]; });
            });
        });
    });
}

async function inicializarApp() {
    Object.keys(OBJETIVOS_POR_MES).forEach(mes => { initValores(OBJETIVOS_POR_MES[mes], SPRINTS_POR_MES[mes] || []); });
    cargarDatosLocal();
    const config = getJsonBinConfig();
    if (config) {
        document.getElementById("btnSync").style.display = "inline-block";
        const r = await cargarDesdeNube(true);
    }
    renderMesBotones();
    renderHeader();
    renderTable();
    renderDashboardResumen();
    document.getElementById("mainTitle").textContent = `🎯 Seguimiento de Objetivos Q3 — ${MESES_LABEL[mesActual]}`;
    iniciarSync();
}
inicializarApp();
</script>
